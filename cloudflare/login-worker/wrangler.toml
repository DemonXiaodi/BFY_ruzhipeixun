name = "nw-login-worker"
main = "worker.js"
compatibility_date = "2024-09-23"

# 阶段1 用 "1"（mock，不依赖企微）；拿到 corpid/agentid/corpsecret 后改 "0"
[vars]
MOCK = "1"

# ---- 阶段2：记录用户名到 D1（可选但推荐）----
# 1) 建库：  wrangler d1 create nw-login
# 2) 建表：
#    wrangler d1 execute nw-login --remote --command "CREATE TABLE IF NOT EXISTS logins(userid TEXT, name TEXT, login_at INTEGER)"
#    wrangler d1 execute nw-login --remote --command "CREATE TABLE IF NOT EXISTS sheet_max(user TEXT PRIMARY KEY, values_json TEXT, at INTEGER)"
#    （sheet_max 用于"上报进度取历史最大值"：低进度不覆盖表格里的高进度；不建此表则 /report 只直写、无最大值保护）
# 3) 取消下面注释，把 database_id 换成上一步返回的 ID
# [[d1_databases]]
# binding = "DB"
# database_name = "nw-login"
# database_id = "你的D1库ID"

# ---- 凭证不要写在这里！用 secret 注入 ----
#   wrangler secret put CORPID
#   wrangler secret put AGENTID
#   wrangler secret put CORPSECRET
#   wrangler secret put VERIFY_TXT
